name: Fetch photos
# targets.tsv か fetch_photos.py が変わったら、Wikimedia Commons から写真の情報を集めて commons.tsv をコミットする
on:
  push:
    branches: [main]
    paths: ["tools/photos/targets.tsv", "tools/fetch_photos.py"]
  workflow_dispatch:
concurrency:
  group: fetch-photos
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_photos.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/photos/commons.tsv
          git diff --cached --quiet || (git commit -m "Update Commons photo list" && git pull --rebase origin main && git push)
